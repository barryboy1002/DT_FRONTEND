<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Shopping cart -->
  <g transform="translate(20, 20)">
    <!-- Cart body -->
    <path d="M 10 15 L 15 35 L 45 35 L 50 15 Z" fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Cart handle -->
    <path d="M 8 15 L 5 5 L 0 5" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Cart wheels -->
    <circle cx="20" cy="42" r="4" fill="white"/>
    <circle cx="40" cy="42" r="4" fill="white"/>
    
    <!-- Barcode lines on cart -->
    <line x1="20" y1="20" x2="20" y2="30" stroke="#2563eb" stroke-width="2"/>
    <line x1="25" y1="20" x2="25" y2="30" stroke="#2563eb" stroke-width="2"/>
    <line x1="30" y1="20" x2="30" y2="30" stroke="#2563eb" stroke-width="2"/>
    <line x1="35" y1="20" x2="35" y2="30" stroke="#2563eb" stroke-width="2"/>
    <line x1="40" y1="20" x2="40" y2="30" stroke="#2563eb" stroke-width="2"/>
  </g>
</svg>
